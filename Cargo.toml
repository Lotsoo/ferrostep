[package]
name = "ferrostep"
version = "0.1.0"
edition = "2024"
description = "Modern 4-panel rhythm game with an MP3/MP4 auto-charter and plug-and-play dance mat support"
license = "MIT"
readme = "README.md"
keywords = ["game", "rhythm", "stepmania", "dance-mat"]
categories = ["games"]
publish = false

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.37.0"
env_logger = "0.11.11"
gilrs = "0.11.2"
hound = "3.5.1"
kira = "0.12.6"
log = "0.4.35"
notify = "8.2.2"
rand = "0.10.4"
rand_chacha = "0.10.0"
rfd = "0.18.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "wav", "flac", "pcm"] }
thiserror = "2.0.21"
toml = "1.2.1"
zune-core = "0.5"
zune-jpeg = "0.5"

# Light optimisation for our code and full optimisation for dependencies in
# debug builds: keeps `cargo run`/`cargo test` fast (FFT, decoding) while
# compile times stay short.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Smaller, faster release binary. Debug info is stripped but symbol names stay,
# so crash.log backtraces still show function names.
[profile.release]
lto = "thin"
codegen-units = 4
strip = "debuginfo"

[build-dependencies]
winresource = "0.1.34"

# Fedora RPM via `cargo generate-rpm` (after `cargo build --release`).
[package.metadata.generate-rpm]
summary = "Modern 4-panel rhythm game for keyboard and USB dance mats"
assets = [
    { source = "target/release/ferrostep", dest = "/usr/bin/ferrostep", mode = "755" },
    { source = "packaging/ferrostep.desktop", dest = "/usr/share/applications/ferrostep.desktop", mode = "644" },
    { source = "assets/icons/ferrostep.svg", dest = "/usr/share/icons/hicolor/scalable/apps/ferrostep.svg", mode = "644" },
    { source = "assets/icons/ferrostep-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/ferrostep.png", mode = "644" },
    { source = "assets/icons/ferrostep-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/ferrostep.png", mode = "644" },
    { source = "assets/icons/ferrostep-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/ferrostep.png", mode = "644" },
    { source = "assets/icons/ferrostep-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/ferrostep.png", mode = "644" },
    { source = "assets/icons/ferrostep-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/ferrostep.png", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/ferrostep/LICENSE", mode = "644" },
    { source = "assets/fonts/LICENSE-Inter.txt", dest = "/usr/share/licenses/ferrostep/LICENSE-Inter.txt", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/ferrostep/README.md", mode = "644" },
]
