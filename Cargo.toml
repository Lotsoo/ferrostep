[package]
name = "ferrostep"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
crossbeam-channel = "0.5.17"
directories = "6.0.0"
eframe = "0.37.0"
env_logger = "0.11.11"
gilrs = "0.11.2"
hound = "3.5.1"
kira = "0.12.6"
log = "0.4.35"
notify = "8.2.2"
rand = "0.10.4"
rand_chacha = "0.10.0"
rfd = "0.18.0"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "wav", "flac", "pcm"] }
thiserror = "2.0.21"
toml = "1.2.1"

# Light optimisation for our code and full optimisation for dependencies in
# debug builds: keeps `cargo run`/`cargo test` fast (FFT, decoding) while
# compile times stay short.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
